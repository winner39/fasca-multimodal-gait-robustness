[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gait-robust"
version = "0.1.0"
description = "Reproducibility code for fault-aware multimodal gait classification"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "mne>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

